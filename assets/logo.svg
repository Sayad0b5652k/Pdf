<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131B23"/>
      <stop offset="50%" stop-color="#0A0F14"/>
      <stop offset="100%" stop-color="#1A2530"/>
    </linearGradient>

    <!-- Accent Orange Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A42"/>
      <stop offset="50%" stop-color="#FF6A2B"/>
      <stop offset="100%" stop-color="#E04800"/>
    </linearGradient>

    <!-- Teal Tech Accent Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#56E3D9"/>
      <stop offset="100%" stop-color="#2FC6BC"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Base Rounded Shield Container -->
    <rect x="25" y="25" width="450" height="450" rx="90" fill="url(#bgGrad)" stroke="#243441" stroke-width="4"/>
    <rect x="25" y="25" width="450" height="450" rx="90" fill="none" stroke="url(#orangeGrad)" stroke-width="2" opacity="0.4" filter="url(#glow)"/>

    <!-- Geometric Hexagon / Academic Crest Outline -->
    <path d="M 250 85 L 390 155 L 390 315 L 250 415 L 110 315 L 110 155 Z" fill="#0F161D" stroke="#22303D" stroke-width="6"/>
    <path d="M 250 85 L 390 155 L 390 315 L 250 415 L 110 315 L 110 155 Z" fill="none" stroke="url(#tealGrad)" stroke-width="3" opacity="0.7"/>

    <!-- Stylized Open Academic Book / Smart Document Wings -->
    <!-- Left Page -->
    <path d="M 250 200 C 210 175 160 180 135 190 L 135 320 C 160 310 210 305 250 330 Z" fill="url(#orangeGrad)" opacity="0.95"/>
    
    <!-- Right Page -->
    <path d="M 250 200 C 290 175 340 180 365 190 L 365 320 C 340 310 290 305 250 330 Z" fill="url(#orangeGrad)" opacity="0.8"/>

    <!-- Center Spine Line -->
    <line x1="250" y1="200" x2="250" y2="330" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>

    <!-- AI Sparkle / Neural Intelligence Star at Top -->
    <g transform="translate(250, 135)" filter="url(#glow)">
      <!-- 4-point AI Star -->
      <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="#FFFFFF"/>
      <circle cx="0" cy="0" r="4" fill="url(#tealGrad)"/>
    </g>

    <!-- Secondary Small AI Sparks -->
    <path d="M 175 130 Q 175 142 187 142 Q 175 142 175 154 Q 175 142 163 142 Q 175 142 175 130 Z" fill="url(#tealGrad)" opacity="0.9"/>
    <path d="M 325 130 Q 325 142 337 142 Q 325 142 325 154 Q 325 142 313 142 Q 325 142 325 130 Z" fill="url(#tealGrad)" opacity="0.9"/>

    <!-- Academic Graduation Cap Peak Accent over Book -->
    <polygon points="250,165 310,185 250,205 190,185" fill="#1A2530" stroke="url(#orangeGrad)" stroke-width="3"/>

    <!-- Bottom Emblem Text / Athar Labs Tag -->
    <rect x="180" y="365" width="140" height="26" rx="13" fill="#1A2530" stroke="#243441" stroke-width="1.5"/>
    <text x="250" y="382" fill="#8CA1AF" font-family="'IBM Plex Sans', sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">ATHAR LABS</text>
  </g>
</svg>
